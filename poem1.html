<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>詩的賞析1 - 將進酒</title>
    <style>
        /* *1 整頁背景設為粉紅色 */
        body {
            background-color: pink;
            text-align: center;
            padding: 20px;
        }
        /* *2 詩的標題設為：藍色、40點字 */
        .poem-title {
            color: blue;
            font-size: 40pt;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .poem-author {
            font-size: 20pt;
            color: #333;
            margin-bottom: 30px;
        }
        /* *2 詩的內容設為：綠色、30點字 */
        .poem-content {
            color: green;
            font-size: 30pt;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        /* *3 頁面中央放1幅畫像圖（寬度300px），深紫色圖框線(5px)、四周做成圓角（半徑50px） */
        .portrait {
            width: 300px;
            height: auto;
            border: 5px solid purple;
            border-radius: 50px;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="poem-title">將進酒</div>
    <div class="poem-author">唐 · 李白</div>
    <div class="poem-content">
        君不見，黃河之水天上來，奔流到海不復回。<br>
        君不見，高堂明鏡悲白髮，朝如青絲暮成雪。<br>
        人生得意須盡歡，莫使金樽空對月。<br>
        天生我材必有用，千金散盡還復來。
    </div>
	<img class="portrait" src="libai.jpg" alt="李白畫像">
</body>
</html>
