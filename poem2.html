<body>

    <div class="poem-title">烏衣巷</div>
    <div class="poem-author">唐 · 劉禹錫</div>
    
    <div class="poem-content">
        朱雀橋邊野草花，烏衣巷口夕陽斜。<br>
        舊時王謝堂前燕，飛入尋常百姓家。
    </div>
